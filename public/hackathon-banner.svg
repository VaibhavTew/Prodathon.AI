<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-labelledby="t d">
  <title id="t">Prodathon — The AI Hackathon for College Students</title>
  <desc id="d">Free to register. ₹2,00,000 grand prize, ₹50,000 runner-up, certificates for every participant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F2FF"/>
      <stop offset=".55" stop-color="#FBF7FF"/>
      <stop offset="1" stop-color="#FFF1F7"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B3DF5"/>
      <stop offset=".55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="blobA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7A63FF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7A63FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#EC4899" stop-opacity=".30"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#14142B" stroke-opacity=".05"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5B3DF5" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>
  <circle cx="1270" cy="170" r="360" fill="url(#blobA)"/>
  <circle cx="1480" cy="520" r="300" fill="url(#blobB)"/>
  <circle cx="120" cy="560" r="260" fill="url(#blobA)" opacity=".5"/>

  <!-- Neural network motif -->
  <g stroke="#5B3DF5" stroke-opacity=".35" stroke-width="2" fill="none">
    <path d="M1120 140 L1260 230 L1400 150 M1120 140 L1260 330 L1400 150 M1120 300 L1260 230 L1400 330 M1120 300 L1260 330 L1400 330 M1120 460 L1260 430 L1400 330 M1120 460 L1260 330 M1260 430 L1400 470 M1260 230 L1400 330 M1120 300 L1260 430"/>
  </g>
  <g fill="#FFFFFF" stroke="url(#brand)" stroke-width="4">
    <circle cx="1120" cy="140" r="16"/><circle cx="1120" cy="300" r="16"/><circle cx="1120" cy="460" r="16"/>
    <circle cx="1260" cy="230" r="20"/><circle cx="1260" cy="330" r="20"/><circle cx="1260" cy="430" r="20"/>
    <circle cx="1400" cy="150" r="16"/><circle cx="1400" cy="330" r="24"/><circle cx="1400" cy="470" r="16"/>
  </g>
  <circle cx="1400" cy="330" r="9" fill="url(#brand)"/>

  <!-- Trophy -->
  <g transform="translate(1440 70)" filter="url(#shadow)">
    <rect width="104" height="104" rx="28" fill="#FFFFFF"/>
    <path d="M34 28h36v14c0 12-8 22-18 22s-18-10-18-22z" fill="url(#brand)"/>
    <path d="M34 32h-10c0 10 6 16 12 17M70 32h10c0 10-6 16-12 17" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
    <rect x="47" y="63" width="10" height="12" fill="#8B5CF6"/>
    <rect x="36" y="74" width="32" height="8" rx="4" fill="#5B3DF5"/>
  </g>

  <!-- Copy -->
  <g font-family="'Space Grotesk','Segoe UI',Inter,system-ui,-apple-system,sans-serif">
    <rect x="96" y="92" width="290" height="40" rx="20" fill="#FFFFFF" stroke="#5B3DF5" stroke-opacity=".3"/>
    <circle cx="122" cy="112" r="6" fill="#EC4899"/>
    <text x="140" y="119" font-size="18" font-weight="700" letter-spacing="2.5" fill="#5B3DF5">FREE · ONLINE · INDIA</text>

    <text x="92" y="236" font-size="112" font-weight="800" letter-spacing="-4" fill="url(#brand)">Prodathon</text>
    <text x="96" y="296" font-size="38" font-weight="700" fill="#14142B">The AI Hackathon for College Students</text>
    <text x="96" y="340" font-size="22" fill="#5E5E74">Build a real AI product. Demo it to judges. Win big.</text>

    <!-- Prize chips -->
    <g filter="url(#shadow)">
      <rect x="96" y="388" width="300" height="104" rx="22" fill="url(#brand)"/>
      <text x="124" y="428" font-size="16" font-weight="700" letter-spacing="2" fill="#FFFFFF" fill-opacity=".85">1ST PRIZE</text>
      <text x="124" y="472" font-size="40" font-weight="800" fill="#FFFFFF">₹2,00,000</text>

      <rect x="416" y="388" width="250" height="104" rx="22" fill="#FFFFFF"/>
      <text x="444" y="428" font-size="16" font-weight="700" letter-spacing="2" fill="#5B3DF5">2ND PRIZE</text>
      <text x="444" y="472" font-size="40" font-weight="800" fill="#14142B">₹50,000</text>

      <rect x="686" y="388" width="300" height="104" rx="22" fill="#FFFFFF"/>
      <text x="714" y="428" font-size="16" font-weight="700" letter-spacing="2" fill="#5B3DF5">EVERY PARTICIPANT</text>
      <text x="714" y="470" font-size="30" font-weight="800" fill="#14142B">Certificates</text>
    </g>

    <text x="96" y="548" font-size="20" font-weight="600" fill="#5E5E74">Teams of 1–4  ·  Any branch, any year  ·  Registration is 100% free</text>
  </g>
</svg>
